<!doctype html>
<meta charset="utf-8"><title>아이콘 확인</title>
<style>
:root{--bg:#fff;--fg:#16181d;--line:#e5e7eb;--card:#fafafa;
--ok:#0f7b3d;--bad:#c02626;--warn:#b45309;--mute:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8ec;--line:#252932;
--card:#161920;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--mute:#8b93a1}}
body{background:var(--bg);color:var(--fg);font:15px -apple-system,sans-serif;
padding:30px;margin:0}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:14px;margin-bottom:8px;display:flex;gap:14px;align-items:center}
code{font-size:12px;color:var(--mute)}
.verdict{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:3px}
</style><div class="c"><div><span class="verdict" style="color:var(--ok);border:1px solid var(--ok)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 L6 8 L9 10 L14 4"/><path d="M10.5 4H14v3.5"/></svg>통과</span></div><code>🟢 통과</code></div><div class="c"><div><span class="verdict" style="color:var(--warn);border:1px solid var(--warn)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12v-2M5.5 12v-2.5M9 12V2M12.5 12v-2"/><path d="M1 13.5h14" opacity=".35"/></svg>한 방 의존</span></div><code>🎲 한 방 의존</code></div><div class="c"><div><span class="verdict" style="color:var(--bad);border:1px solid var(--bad)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4 L6 8 L9 6 L14 12"/><path d="M10.5 12H14V8.5"/></svg>탈락</span></div><code>🔴 탈락</code></div><div class="c"><div><span class="verdict" style="color:var(--mute);border:1px solid var(--mute)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v8M4.5 5v6M7 3v10M9.5 5v6M12 4v8M14 6v4"/></svg>봇</span></div><code>🤖 봇</code></div><div class="c"><div><span class="verdict" style="color:var(--mute);border:1px dashed var(--mute)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12v-3M5.5 12v-4"/><path d="M9 12v-6M12.5 12v-8" stroke-dasharray="1.5 2"/></svg>표본 부족</span></div><code>⏳ 표본 부족</code></div><div class="c"><div><span class="verdict" style="color:var(--mute);border:1px dashed var(--mute)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke-dasharray="2 2.5"/></svg>판정 보류</span></div><code>⚪ 판정 보류</code></div><div class="c"><div><span class="verdict" style="color:var(--warn);border:1px dashed var(--warn)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h3.5M10.5 8H14"/><path d="M8 8h.01" stroke-width="2"/></svg>조회 실패</span></div><code>⚠️ 조회 실패</code></div>
